  :root{
    --teal-900:#182117; --teal-700:#182117; --teal-500:#779286; --teal-100:#e6ebe9;

    --font-display:'EB Garamond',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand-50); color:var(--ink-900); min-height:100vh;
    font-family:'Jost',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-style:italic;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%; max-width:420px;}
  header{text-align:center; margin-bottom:22px;}
  header h1{margin:0 0 4px; font-family:var(--font-display); font-size:28px; font-weight:600; font-style:italic; color:var(--teal-900); letter-spacing:.2px;}
  header p{margin:0; font-size:14px; color:var(--ink-600);}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px; margin-bottom:12px;
  }
  .btn-opt{
    width:100%; display:flex; align-items:center; gap:12px; text-align:left;
    background:var(--sand-100); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; font-size:15px; font-weight:600; color:var(--ink-900);
    font-family:inherit; cursor:pointer;
  }
  .btn-opt:active{background:var(--sand-200);}
  .btn-opt .ic{font-size:22px;}
  .btn-opt .sub{display:block; font-size:12.5px; font-weight:400; color:var(--ink-600); margin-top:2px;}
  textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-family:inherit; font-size:14px; resize:vertical; min-height:80px; margin-bottom:10px;
  }
  .btn-primary{
    width:100%; background:var(--teal-700); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .btn-primary:disabled{opacity:.6;}
  .btn-ghost{
    width:100%; background:none; border:none; color:var(--teal-700); font-weight:700;
    font-size:14px; padding:10px; font-family:inherit; cursor:pointer;
  }
  .ok-icon{font-size:40px; text-align:center; margin-bottom:6px;}
  .ok-title{text-align:center; font-size:17px; font-weight:700; margin:0 0 4px;}
  .ok-sub{text-align:center; font-size:14px; color:var(--ink-600); margin:0 0 18px;}
  .error-box{text-align:center; color:var(--red-600); font-size:14px; padding:20px 0;}
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--ink-900); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:.2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .qty-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 2px; border-bottom:1px solid var(--line); font-size:14.5px;
  }
  .qty-row:last-child{border-bottom:none;}
  .qty-name{flex:1; min-width:0;}
  .qty-ctrl{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .qty-btn{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
    background:var(--sand-100); font-size:17px; font-family:inherit; color:var(--ink-900); cursor:pointer;
  }
  .qty-val{min-width:18px; text-align:center; font-weight:700;}
  .lang-switch{display:flex; justify-content:center; gap:6px; margin-bottom:14px;}
  .lang-btn{
    border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:5px 11px; font-size:12px; font-weight:700; font-family:inherit;
    color:var(--ink-600); cursor:pointer; font-style:normal;
  }
  .lang-btn.active{background:var(--teal-700); border-color:var(--teal-700); color:#fff;}
</style>

  // Preços (lista pública só de leitura). Se a lista ainda não existir, a página funciona sem valores.
  var PRECOS = {}, PRECO_LENHA = null;
  function normItem(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }
  function moeda(v){ return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
  // Casamento tolerante: "Coca Cola lata 350ml" no estoque = "Coca-Cola" na página.
  // Variantes (zero, limão, com/sem gás…) nunca se misturam.
  var PRECOS_CACHE = {};
  var VARIANTES = {zero:1,diet:1,light:1,sem:1,com:1,gas:1,limao:1,maracuja:1,classic:1,filtrado:1,expresso:1,pleno:1,cappuccino:1,"60":1};
  function tokensItem(s){
    return normItem(s).replace(/[^a-z0-9]+/g," ").split(" ").filter(function(w){
      return w && !/^(de|da|do|das|dos|e|lata|garrafa|long|neck|pet|unidade|un|pacote|pct|barra)$/.test(w) && !/^\d+(ml|g|l|kg)$/.test(w);
    });
  }
  function precoDe(nomeItem){
    var k = normItem(nomeItem);
    if(PRECOS[k] != null) return PRECOS[k];
    if(k in PRECOS_CACHE) return PRECOS_CACHE[k];
    var g = tokensItem(nomeItem), achados = [];
    Object.keys(PRECOS).forEach(function(nm){
      var t = tokensItem(nm);
      var igual = g.length === t.length && g.every(function(w){ return t.indexOf(w) >= 0; });
      var gSub = g.every(function(w){ return t.indexOf(w) >= 0; });
      var tSub = t.every(function(w){ return g.indexOf(w) >= 0; });
      var dif = gSub ? t.filter(function(w){ return g.indexOf(w) < 0; }) : tSub ? g.filter(function(w){ return t.indexOf(w) < 0; }) : null;
      if(igual || (dif && !dif.some(function(w){ return VARIANTES[w]; }))) achados.push(PRECOS[nm]);
    });
    return (PRECOS_CACHE[k] = (achados.length === 1 ? achados[0] : null));
  }
  async function carregarPrecos(){

      r.data.forEach(function(x){
        if(x.tipo === "lenha"){ if(x.preco!=null) PRECO_LENHA = Number(x.preco); }
        else if(x.preco!=null) PRECOS[normItem(x.nome)] = Number(x.preco);
      });
    }catch(e){ /* sem preços: segue normal */ }
  }

  var JANELA_PENDENTE_MS = 3 * 3600 * 1000;      // pedido ainda aberto: esquece depois de 3h
  var JANELA_CONCLUIDO_MS = 20 * 60 * 1000;      // já concluído: some da lista 20min depois

  function chaveStorage(){ return "bagua_pedidos_" + slug; }

  function salvarPedidoLocal(id, tabela, labelKey){
    try{
      var lista = carregarPedidosLocaisBrutos();
      lista.push({id:id, tabela:tabela, labelKey:labelKey, criadoEm:Date.now(), concluidoEm:null});
      localStorage.setItem(chaveStorage(), JSON.stringify(lista.slice(-8)));
    }catch(e){ /* localStorage indisponível — só perde o acompanhamento, não trava o pedido */ }
  }

  // Chamado sempre que a gente confirma (busca ou tempo real) que um pedido
  // ficou concluído, pra começar a contar os 20min até ele sumir da lista.
  function marcarConcluidoLocal(id){
    try{
      var lista = carregarPedidosLocaisBrutos();
      var achou = false;
      lista.forEach(function(p){ if(p.id === id && !p.concluidoEm){ p.concluidoEm = Date.now(); achou = true; } });
      if(achou) localStorage.setItem(chaveStorage(), JSON.stringify(lista));
    }catch(e){}
  }

  function carregarPedidosLocaisBrutos(){
    try{
      var raw = localStorage.getItem(chaveStorage());
      var lista = raw ? JSON.parse(raw) : [];
      var agora = Date.now();
      lista = lista.filter(function(p){
        if(p.concluidoEm) return (agora - p.concluidoEm) < JANELA_CONCLUIDO_MS;
        return (agora - p.criadoEm) < JANELA_PENDENTE_MS;
      });
      localStorage.setItem(chaveStorage(), JSON.stringify(lista));
      return lista;
    }catch(e){ return []; }
  }

      }
      h += '<p style="margin:16px 0 8px;font-size:15px;font-weight:700;">'+t("algumRecado")+'</p>' +
        '<textarea id="reparoRecado" placeholder="'+escapeHtml(t("recadoPlaceholder"))+'">'+escapeHtml(est.recado)+'</textarea>' +
        '<button class="btn-primary" id="reparoEnviar">'+t("enviarPedido")+'</button>' +
        '<button class="btn-ghost" id="reparoVoltar">'+t("voltar")+'</button>' +
      '</div>';
      content.innerHTML = h;
      function guardarCampos(){
        est.texto = document.getElementById("reparoTexto").value;
        est.recado = document.getElementById("reparoRecado").value;
      }
      document.getElementById("reparoVoltar").onclick = renderMenu;
      content.querySelectorAll("[data-pres]").forEach(function(b){
        b.onclick = function(){ guardarCampos(); est.pres = b.getAttribute("data-pres"); est.entrada = null; est.horario = null; pintar(); };
      });
      content.querySelectorAll("[data-ent]").forEach(function(b){
        b.onclick = function(){ guardarCampos(); est.entrada = b.getAttribute("data-ent"); est.horario = null; pintar(); };
      });
      content.querySelectorAll("[data-hor]").forEach(function(b){
        b.onclick = function(){ guardarCampos(); est.horario = b.getAttribute("data-hor"); pintar(); };
      });
      var hora = document.getElementById("reparoHora");
      if(hora) hora.onchange = function(){ guardarCampos(); est.horario = hora.value || null; pintar(); };
      document.getElementById("reparoEnviar").onclick = function(){
        guardarCampos();
        var texto = est.texto.trim();
        if(!texto){ showToast(t("descrevaProblema")); return; }
        if(!est.pres || !est.entrada){ showToast(t("escolhaOpcao")); return; }
        if(est.entrada === "depois" && !est.horario){ showToast(t("escolhaHorario")); return; }
        enviarReparo(texto, {hospede_presenca:est.pres, hospede_entrada:est.entrada, hospede_horario:(est.entrada==="depois"?est.horario:null), hospede_recado:(est.recado.trim()||null)});
      };
    }
    pintar();
  }

  // Insere o pedido com as respostas do hóspede (presença, horário...). Se o
  // banco ainda não tiver as colunas novas, tenta de novo sem elas pra o pedido
  // nunca deixar de chegar (as respostas vão junto na descrição do reparo).
  async function inserirComExtras(tabela, payload, extras){
    var comExtras = Object.assign({}, payload, extras || {});
    var res = await sb.from(tabela).insert(comExtras);
    if(res.error && extras && /column|schema cache/i.test(String(res.error.message||""))){
      var semExtras = Object.assign({}, payload);
      if(tabela === "manutencoes"){
        var linhas = [];
        linhas.push("Hóspede: " + (extras.hospede_presenca === "dentro" ? "está na acomodação" : "não está na acomodação"));
        if(extras.hospede_entrada) linhas.push("Equipe pode entrar: " + (extras.hospede_entrada === "agora" ? "agora" : ("em outro horário" + (extras.hospede_horario ? " (" + extras.hospede_horario + ")" : ""))));
        if(extras.hospede_recado) linhas.push("Recado: " + extras.hospede_recado);
        semExtras.description = (payload.description || "") + "\n\n" + linhas.join("\n");
      }
      res = await sb.from(tabela).insert(semExtras);
    }
    return res;
  }

  // Já existe um pedido igual (mesmo tipo) ainda em aberto para esta acomodação?
  // Vale pra qualquer aparelho/hóspede: evita pedidos duplicados de limpeza etc.
  async function pedidoAbertoIgual(tipo, contexto){
    try{
      var r = await sb.from("solicitacoes_acomodacao").select("id,status,contexto").eq("acomodacao_id", slug).eq("tipo", tipo)
        .in("status", ["pendente","em_andamento","bloqueada"]).is("excluido_em", null).limit(10);
      if(r.error || !r.data || !r.data.length) return null;
      // troca de lenha molhada e reposição de lenha são pedidos diferentes
      var achado = r.data.filter(function(x){ return tipo !== "lenha" || ((x.contexto === "troca_lenha_molhada") === (contexto === "troca_lenha_molhada")); })[0];
      return achado || null;
    }catch(e){ return null; }
  }
  function acompanharPedidoExistente(ped, tipo){
    try{
      var lista = carregarPedidosLocaisBrutos();
      if(!lista.some(function(x){ return x.id === ped.id; })) salvarPedidoLocal(ped.id, "solicitacoes_acomodacao", TIPO_LABEL_KEY[tipo] || tipo);
    }catch(e){}
    showToast(t("jaTemPedido"));
    renderAcompanhamento();
  }

  async function enviarSolicitacao(tipo, extras){
    content.innerHTML = '<div class="card error-box" style="color:var(--ink-600);">'+t("enviando")+'</div>';
    try{
      var ehTroca = !!(extras && extras.contexto === "troca_lenha_molhada");
      var existente = await pedidoAbertoIgual(tipo, ehTroca ? "troca_lenha_molhada" : null);
      if(existente){ acompanharPedidoExistente(existente, ehTroca ? "lenha_troca" : tipo); return; }
      var id = uid();
      var payload = {
        id: id,
        acomodacao_id: slug,
        tipo: tipo,
        contexto: (tipo === "limpeza" ? "estadia" : null),
        origem: "hospede",
        status: "pendente"
      };
      var res = await inserirComExtras("solicitacoes_acomodacao", payload, extras);
      if(res.error) throw res.error;
      salvarPedidoLocal(id, "solicitacoes_acomodacao", ehTroca ? "trocarLenha" : (TIPO_LABEL_KEY[tipo] || tipo));
      renderAcompanhamento();
    }catch(err){
      console.error(err);
      content.innerHTML = '<div class="card error-box">'+t("erroEnviar")+'</div>' +
        '<button class="btn-ghost" id="tentarDeNovo">'+t("voltar")+'</button>';
      document.getElementById("tentarDeNovo").onclick = renderMenu;
    }
  }

  async function enviarFrigobar(itens){
    content.innerHTML = '<div class="card error-box" style="color:var(--ink-600);">'+t("enviando")+'</div>';
    try{
      var existenteF = await pedidoAbertoIgual("frigobar");
      if(existenteF){ acompanharPedidoExistente(existenteF, "frigobar"); return; }
      var id = uid();
      var payload = {
        id: id,
        acomodacao_id: slug,
        tipo: "frigobar",
        origem: "hospede",
        status: "pendente",
        itens: itens
      };
      var res = await sb.from("solicitacoes_acomodacao").insert(payload);
      if(res.error) throw res.error;
      salvarPedidoLocal(id, "solicitacoes_acomodacao", "tipoFrigobar");
      renderAcompanhamento();
    }catch(err){
      console.error(err);
      content.innerHTML = '<div class="card error-box">'+t("erroEnviar")+'</div>' +
        '<button class="btn-ghost" id="tentarDeNovo">'+t("voltar")+'</button>';
      document.getElementById("tentarDeNovo").onclick = renderMenu;
    }
  }

  async function enviarReparo(texto, extras){
    content.innerHTML = '<div class="card error-box" style="color:var(--ink-600);">'+t("enviando")+'</div>';
    try{
      var id = uid();
      var payload = {
        id: id,
        title: "Pedido do hóspede — " + nome,
        local: nome,
        description: texto,
        status: "pendente",
        origem: "hospede"
      };
      var res = await inserirComExtras("manutencoes", payload, extras);
      if(res.error) throw res.error;
      salvarPedidoLocal(id, "manutencoes", "tipoReparo");
      renderAcompanhamento();
    }catch(err){
      console.error(err);
      content.innerHTML = '<div class="card error-box">'+t("erroEnviar")+'</div>' +
        '<button class="btn-ghost" id="tentarDeNovo">'+t("voltar")+'</button>';
      document.getElementById("tentarDeNovo").onclick = renderMenu;
    }
  }

  var TIPO_LABEL_KEY = {
    limpeza: "tipoLimpeza", reparo: "tipoReparo",
    sauna: "ligarSauna", lenha: "reposicaoLenha", lenha_troca: "trocarLenha", frigobar: "tipoFrigobar"
  };

  var canaisAbertos = [];
  function pararAcompanhamentoRealtime(){
    canaisAbertos.forEach(function(ch){ sb.removeChannel(ch); });
    canaisAbertos = [];
  }

  async function renderAcompanhamento(){
    pararAcompanhamentoRealtime();
    var pedidos = carregarPedidosLocaisBrutos();
    if(pedidos.length === 0){ renderMenu(); return; }

    content.innerHTML =
      '<div class="card">' +
        '<p style="margin:0 0 12px;font-size:15px;font-weight:700;">'+t("seusPedidos")+'</p>' +
        '<div id="listaPedidos"></div>' +
        '<button class="btn-primary" id="novoPedido" style="margin-top:6px;">'+t("fazerOutroPedido")+'</button>' +
      '</div>';
    document.getElementById("novoPedido").onclick = function(){ pararAcompanhamentoRealtime(); renderMenu(); };

    var lista = document.getElementById("listaPedidos");

    function pintarLinha(p, status){
      var info = statusInfo(p.tabela, status);
      var concluido = (p.tabela === "manutencoes") ? "concluida" : "concluido";
      if(status === concluido) marcarConcluidoLocal(p.id);
      var el = document.getElementById("pedido_" + p.id);
      if(!el) return;
      el.innerHTML =
        '<span style="font-size:20px;">'+info.icone+'</span>' +
        '<span style="flex:1;"><span style="display:block;font-weight:600;font-size:14.5px;">'+escapeHtml(t(p.labelKey))+'</span>' +
        '<span style="font-size:12.5px;color:'+info.cor+';font-weight:600;">'+info.texto+'</span></span>';
    }

    pedidos.forEach(function(p){
      var linha = document.createElement("div");
      linha.id = "pedido_" + p.id;
      linha.style.cssText = "display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);";
      lista.appendChild(linha);
      pintarLinha(p, "pendente"); // estado inicial otimista, corrigido abaixo assim que a busca real chega
    });
    var ultimoDaLista = lista.lastElementChild;
    if(ultimoDaLista) ultimoDaLista.style.borderBottom = "none";

    // busca o status atual de cada um e liga o tempo real pra acompanhar mudanças
    for(var i=0;i<pedidos.length;i++){
      (function(p){
        sb.from(p.tabela).select("status").eq("id", p.id).single().then(function(res){
          if(res.data) pintarLinha(p, res.data.status);
        });
        var ch = sb.channel("acompanha-"+p.id)
          .on("postgres_changes", {event:"UPDATE", schema:"public", table:p.tabela, filter:"id=eq."+p.id}, function(payload){
            pintarLinha(p, payload.new.status);
          })
          .subscribe();
        canaisAbertos.push(ch);
      })(pedidos[i]);
    }
  }

  function iniciar(){ if(carregarPedidosLocaisBrutos().length > 0) renderAcompanhamento(); else renderMenu(); }
  var iniciou = false;
  function iniciarUmaVez(){ if(iniciou) return; iniciou = true; iniciar(); }
  setTimeout(iniciarUmaVez, 2000); // não deixa o hóspede esperando se a lista de preços demorar
  carregarPrecos().then(iniciarUmaVez);
})();
</script>
