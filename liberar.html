<title>Bagua Bangalôs</title>
<style>

  :root{
    --teal-900:#1c4238; --teal-700:#2f6f5e; --teal-500:#4a9483; --teal-100:#e4f0ec;
    --sand-50:#faf7f2; --sand-100:#f4ede1; --sand-200:#e9dfcd;
    --ink-900:#2b2620; --ink-600:#6b6355; --ink-400:#a39a89; --line:#e3dbcb;
    --red-600:#b3432f; --radius:16px;
    --shadow:0 1px 2px rgba(43,38,32,.06), 0 4px 16px rgba(43,38,32,.08);
    --font-display:'EB Garamond',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand-50); color:var(--ink-900); min-height:100vh;
    font-family:'Jost',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-style:italic;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%; max-width:420px;}
  header{text-align:center; margin-bottom:22px;}
  header h1{margin:0 0 4px; font-family:var(--font-display); font-size:28px; font-weight:600; font-style:italic; color:var(--teal-900); letter-spacing:.2px;}
  header p{margin:0; font-size:14px; color:var(--ink-600);}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px; margin-bottom:12px;
  }
  .btn-opt{
    width:100%; display:flex; align-items:center; gap:12px; text-align:left;
    background:var(--sand-100); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; font-size:15px; font-weight:600; color:var(--ink-900);
    font-family:inherit; cursor:pointer;
  }
  .btn-opt:active{background:var(--sand-200);}
  .btn-opt .ic{font-size:22px;}
  .btn-opt .sub{display:block; font-size:12.5px; font-weight:400; color:var(--ink-600); margin-top:2px;}
  textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-family:inherit; font-size:14px; resize:vertical; min-height:80px; margin-bottom:10px;
  }
  .btn-primary{
    width:100%; background:var(--teal-700); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .btn-primary:disabled{opacity:.6;}
  .btn-ghost{
    width:100%; background:none; border:none; color:var(--teal-700); font-weight:700;
    font-size:14px; padding:10px; font-family:inherit; cursor:pointer;
  }
  .ok-icon{font-size:40px; text-align:center; margin-bottom:6px;}
  .ok-title{text-align:center; font-size:17px; font-weight:700; margin:0 0 4px;}
  .ok-sub{text-align:center; font-size:14px; color:var(--ink-600); margin:0 0 18px;}
  .error-box{text-align:center; color:var(--red-600); font-size:14px; padding:20px 0;}
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--ink-900); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:.2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .qty-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 2px; border-bottom:1px solid var(--line); font-size:14.5px;
  }
  .qty-row:last-child{border-bottom:none;}
  .qty-name{flex:1; min-width:0;}
  .qty-ctrl{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .qty-btn{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
    background:var(--sand-100); font-size:17px; font-family:inherit; color:var(--ink-900); cursor:pointer;
  }
  .qty-val{min-width:18px; text-align:center; font-weight:700;}
  .lang-switch{display:flex; justify-content:center; gap:6px; margin-bottom:14px;}
  .lang-btn{
    border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:5px 11px; font-size:12px; font-weight:700; font-family:inherit;
    color:var(--ink-600); cursor:pointer; font-style:normal;
  }
  .lang-btn.active{background:var(--teal-700); border-color:var(--teal-700); color:#fff;}
</style>

  var LANG_KEY = "bagua_idioma";
  function idiomaPadrao(){
    var nav = (navigator.language || "pt").slice(0,2).toLowerCase();
    return IDIOMAS[nav] ? nav : "pt";
  }
  var lang = (function(){
    try{ return localStorage.getItem(LANG_KEY) || idiomaPadrao(); }catch(e){ return idiomaPadrao(); }
  })();

  function t(key){
    var entry = T[key];
    if(!entry) return key;
    return entry[lang] || entry.pt;

  function tItem(nomeItemPt){
    var mapa = IDIOMAS[lang] && IDIOMAS[lang].itens;
    return (mapa && mapa[nomeItemPt]) || nomeItemPt;
  }

  function renderLangSwitch(){
    var el = document.getElementById("langSwitch");
    el.innerHTML = Object.keys(IDIOMAS).map(function(code){
      return '<button type="button" class="lang-btn'+(code===lang?' active':'')+'" data-lang="'+code+'">'+IDIOMAS[code].nome+'</button>';
    }).join("");
    el.querySelectorAll("[data-lang]").forEach(function(b){
      b.onclick = function(){
        lang = b.getAttribute("data-lang");
        try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
        renderLangSwitch();
        if(carregarPedidosLocaisBrutos().length > 0) renderAcompanhamento(); else renderMenu();
      };
    });
  }

  function uid(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  // ---------- Acompanhamento do pedido (guarda no aparelho do hóspede) ----------
  // Fica só um tempo curto — o suficiente pra acompanhar o próprio pedido, sem
  // risco de um hóspede novo (troca de hospedagem no mesmo quarto) ver pedidos
  // de quem ficou ali antes.
  var JANELA_PENDENTE_MS = 3 * 3600 * 1000;      // pedido ainda aberto: esquece depois de 3h
  var JANELA_CONCLUIDO_MS = 20 * 60 * 1000;      // já concluído: some da lista 20min depois

  function chaveStorage(){ return "bagua_pedidos_" + slug; }

  function salvarPedidoLocal(id, tabela, labelKey){
    try{
      var lista = carregarPedidosLocaisBrutos();
      lista.push({id:id, tabela:tabela, labelKey:labelKey, criadoEm:Date.now(), concluidoEm:null});
      localStorage.setItem(chaveStorage(), JSON.stringify(lista.slice(-8)));
    }catch(e){ /* localStorage indisponível — só perde o acompanhamento, não trava o pedido */ }
  }

  // Chamado sempre que a gente confirma (busca ou tempo real) que um pedido
  // ficou concluído, pra começar a contar os 20min até ele sumir da lista.
  function marcarConcluidoLocal(id){
    try{
      var lista = carregarPedidosLocaisBrutos();
      var achou = false;
      lista.forEach(function(p){ if(p.id === id && !p.concluidoEm){ p.concluidoEm = Date.now(); achou = true; } });
      if(achou) localStorage.setItem(chaveStorage(), JSON.stringify(lista));
    }catch(e){}
  }

  function carregarPedidosLocaisBrutos(){
    try{
      var raw = localStorage.getItem(chaveStorage());
      var lista = raw ? JSON.parse(raw) : [];
      var agora = Date.now();
      lista = lista.filter(function(p){
        if(p.concluidoEm) return (agora - p.concluidoEm) < JANELA_CONCLUIDO_MS;
        return (agora - p.criadoEm) < JANELA_PENDENTE_MS;
      });
      localStorage.setItem(chaveStorage(), JSON.stringify(lista));
      return lista;
    }catch(e){ return []; }
  }

  function statusInfo(tabela, status){
    var concluido = (tabela === "manutencoes") ? "concluida" : "concluido";
    if(status === concluido) return {icone:"✅", texto:t("statusConcluido"), cor:"var(--teal-700)"};
    if(status === "em_andamento") return {icone:"🧹", texto:t("statusACaminho"), cor:"var(--ink-900)"};
    if(status === "bloqueada") return {icone:"⏳", texto:t("statusAguardandoLiberacao"), cor:"var(--ink-600)"};
    return {icone:"⏳", texto:t("statusAguardandoEquipe"), cor:"var(--ink-600)"};
  }

  var slug = params.get("a");
  var acomodacao = slug ? ACOMODACOES[slug] : null;

    label.textContent = "";

  label.textContent = nome;

    var agora = new Date();
    var minutosAgora = agora.getHours()*60 + agora.getMinutes();
    return minutosAgora < (11*60 + 30);
  }

  var numeroGestao = "5561998254114";
  var mensagemGestao = "Olá! 👋 Estou hospedado(a) na acomodação " + nome + " e gostaria de falar com a gestão.";
  var linkGestao = "https://wa.me/" + numeroGestao + "?text=" + encodeURIComponent(mensagemGestao);

  var numeroRecepcao = "5561999343388";
  var mensagemRecepcao = "Olá! 👋 Estou hospedado(a) na acomodação " + nome + " e preciso de ajuda da recepção.";
  var linkRecepcao = "https://wa.me/" + numeroRecepcao + "?text=" + encodeURIComponent(mensagemRecepcao);

  function renderMenu(){
    pararAcompanhamentoRealtime();
    var pedidosAtivos = carregarPedidosLocaisBrutos();
    var bannerHtml = "";
    if(pedidosAtivos.length > 0){
      bannerHtml = '<button class="btn-opt" id="verMeusPedidos" style="background:var(--teal-100);border-color:var(--teal-500);">' +
        '<span class="ic">📋</span><span><span>'+t("verMeusPedidos")+'</span><span class="sub">'+pedidosAtivos.length+t("pedidosRecentes")+'</span></span></button>';
    }
    var limpezaHtml;
    if(limpezaDisponivel()){
      limpezaHtml = '<button class="btn-opt" data-tipo="limpeza"><span class="ic">🧹</span><span><span>'+t("limparQuarto")+'</span><span class="sub">'+t("equipeVaiLa")+'</span></span></button>';
    } else {
      limpezaHtml = '<div style="display:flex;align-items:center;gap:12px;background:var(--sand-100);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;">' +
        '<span class="ic" style="font-size:22px;">🕦</span>' +
        '<span style="font-size:13.5px;color:var(--ink-600);line-height:1.4;">'+t("limpezaAte")+'<strong>11:30</strong>.</span>' +
      '</div>';
    }
    content.innerHTML =
      '<div class="card">' +
        bannerHtml +
        limpezaHtml +
        '<button class="btn-opt" id="btnFrigobar"><span class="ic">🥤</span><span><span>'+t("frigobar")+'</span><span class="sub">'+t("escolherRepor")+'</span></span></button>' +
        '<button class="btn-opt" data-tipo="reparo"><span class="ic">🔧</span><span><span>'+t("naoFunciona")+'</span><span class="sub">'+t("reparoSub")+'</span></span></button>' +
        '<a class="btn-opt" href="https://calendly.com/baguabangalos/jacuzzi" target="_blank" rel="noopener" style="text-decoration:none;"><span class="ic">🛁</span><span><span>'+t("reservarJacuzzi")+'</span><span class="sub">'+t("agendarHorario")+'</span></span></a>' +
        '<button class="btn-opt" data-tipo="sauna"><span class="ic">🧖</span><span><span>'+t("ligarSauna")+'</span><span class="sub">'+t("pedirLigarAgora")+'</span></span></button>' +
        '<button class="btn-opt" data-tipo="lenha"><span class="ic">🪵</span><span><span>'+t("reposicaoLenha")+'</span><span class="sub">'+t("pedirMaisLenha")+'</span></span></button>' +
        '<button class="btn-opt" id="btnGestao" style="margin-bottom:0;background:#e9f9ef;border-color:#25D366;"><span class="ic">💬</span><span><span>'+t("faleGestao")+'</span><span class="sub">'+t("whatsappDireto")+'</span></span></button>' +
      '</div>';
    content.querySelectorAll("[data-tipo]").forEach(function(b){
      b.onclick = function(){
        var tipo = b.getAttribute("data-tipo");
        if(tipo === "reparo") renderReparoForm();
        else enviarSolicitacao(tipo);
      };
    });
    document.getElementById("btnFrigobar").onclick = renderFrigobarForm;
    document.getElementById("btnGestao").onclick = renderConfirmacaoGestao;
    if(document.getElementById("verMeusPedidos")) document.getElementById("verMeusPedidos").onclick = renderAcompanhamento;
  }

  function renderConfirmacaoGestao(){
    content.innerHTML =
      '<div class="card">' +
        '<p style="font-size:13.5px;color:var(--ink-600);line-height:1.5;margin:0 0 14px;">'+t("gestaoTexto1")+'</p>' +
        '<p style="font-size:13.5px;color:var(--ink-900);font-weight:600;line-height:1.5;margin:0 0 16px;">'+t("gestaoTexto2")+'</p>' +
        '<a class="btn-opt" id="btnIrRecepcao" href="'+linkRecepcao+'" target="_blank" rel="noopener" style="text-decoration:none;"><span class="ic">🛎️</span><span><span>'+t("falarRecepcao")+'</span><span class="sub">'+t("whatsappDireto")+'</span></span></a>' +
        '<a class="btn-opt" id="btnIrGestao" href="'+linkGestao+'" target="_blank" rel="noopener" style="margin-bottom:0;text-decoration:none;background:#e9f9ef;border-color:#25D366;"><span class="ic">💬</span><span><span>'+t("continuarGestao")+'</span><span class="sub">'+t("abrirWhatsapp")+'</span></span></a>' +
      '</div>';
  }

  function renderFrigobarForm(){
    var qtys = acomodacao.itens.map(function(){ return 0; });
    var itemsHtml = acomodacao.itens.map(function(nomeItem, i){
      return '<div class="qty-row" data-idx="'+i+'">' +
        '<span class="qty-name">'+escapeHtml(tItem(nomeItem))+'</span>' +
        '<div class="qty-ctrl">' +
          '<button type="button" class="qty-btn" data-act="minus" data-idx="'+i+'">−</button>' +
          '<span class="qty-val" id="qv_'+i+'">0</span>' +
          '<button type="button" class="qty-btn" data-act="plus" data-idx="'+i+'">+</button>' +
        '</div>' +
      '</div>';
    }).join("");
    content.innerHTML =
      '<div class="card">' +
        '<p style="margin:0 0 8px;font-size:14px;color:var(--ink-600);">'+t("escolhaQtd")+'</p>' +
        '<div>'+itemsHtml+'</div>' +
        '<button class="btn-primary" id="fgEnviar" style="margin-top:14px;" disabled>'+t("enviarPedido")+'</button>' +
        '<button class="btn-ghost" id="fgVoltar">'+t("voltar")+'</button>' +
      '</div>';
    document.getElementById("fgVoltar").onclick = renderMenu;
    var enviarBtn = document.getElementById("fgEnviar");
    function atualizarBotao(){
      var any = qtys.some(function(q){ return q > 0; });
      enviarBtn.disabled = !any;
    }
    content.querySelectorAll(".qty-btn").forEach(function(b){
      b.onclick = function(){
        var idx = parseInt(b.getAttribute("data-idx"), 10);
        var act = b.getAttribute("data-act");
        qtys[idx] = Math.max(0, qtys[idx] + (act === "plus" ? 1 : -1));
        document.getElementById("qv_"+idx).textContent = qtys[idx];
        atualizarBotao();
      };
    });
    enviarBtn.onclick = function(){
      var escolhidos = acomodacao.itens
        .map(function(nomeItem, i){ return {nome: nomeItem, quantidade: qtys[i]}; })
        .filter(function(x){ return x.quantidade > 0; });
      if(escolhidos.length === 0) return;
      enviarFrigobar(escolhidos);
    };
  }

  function renderReparoForm(){
    content.innerHTML =
      '<div class="card">' +
        '<p style="margin:0 0 10px;font-size:14px;color:var(--ink-600);">'+t("conteReparo")+'</p>' +
        '<textarea id="reparoTexto" placeholder="'+escapeHtml(t("reparoPlaceholder"))+'"></textarea>' +
        '<button class="btn-primary" id="reparoEnviar">'+t("enviarPedido")+'</button>' +
        '<button class="btn-ghost" id="reparoVoltar">'+t("voltar")+'</button>' +
      '</div>';
    document.getElementById("reparoVoltar").onclick = renderMenu;
    document.getElementById("reparoEnviar").onclick = function(){
      var texto = document.getElementById("reparoTexto").value.trim();
      if(!texto){ showToast(t("descrevaProblema")); return; }
      enviarReparo(texto);
    };
  }

  async function enviarSolicitacao(tipo){
    content.innerHTML = '<div class="card error-box" style="color:var(--ink-600);">'+t("enviando")+'</div>';
    try{
      var id = uid();
      var payload = {
        id: id,
        acomodacao_id: slug,
        tipo: tipo,
        contexto: (tipo === "limpeza" ? "estadia" : null),
        origem: "hospede",
        status: "pendente"
      };
      var res = await sb.from("solicitacoes_acomodacao").insert(payload);
      if(res.error) throw res.error;
      salvarPedidoLocal(id, "solicitacoes_acomodacao", TIPO_LABEL_KEY[tipo] || tipo);
      renderAcompanhamento();
    }catch(err){
      console.error(err);
      content.innerHTML = '<div class="card error-box">'+t("erroEnviar")+'</div>' +
        '<button class="btn-ghost" id="tentarDeNovo">'+t("voltar")+'</button>';
      document.getElementById("tentarDeNovo").onclick = renderMenu;
    }
  }

  async function enviarFrigobar(itens){
    content.innerHTML = '<div class="card error-box" style="color:var(--ink-600);">'+t("enviando")+'</div>';
    try{
      var id = uid();
      var payload = {
        id: id,
        acomodacao_id: slug,
        tipo: "frigobar",
        origem: "hospede",
        status: "pendente",
        itens: itens
      };
      var res = await sb.from("solicitacoes_acomodacao").insert(payload);
      if(res.error) throw res.error;
      salvarPedidoLocal(id, "solicitacoes_acomodacao", "tipoFrigobar");
      renderAcompanhamento();
    }catch(err){
      console.error(err);
      content.innerHTML = '<div class="card error-box">'+t("erroEnviar")+'</div>' +
        '<button class="btn-ghost" id="tentarDeNovo">'+t("voltar")+'</button>';
      document.getElementById("tentarDeNovo").onclick = renderMenu;
    }
  }

  async function enviarReparo(texto){
    content.innerHTML = '<div class="card error-box" style="color:var(--ink-600);">'+t("enviando")+'</div>';
    try{
      var id = uid();
      var payload = {
        id: id,
        title: "Pedido do hóspede — " + nome,
        local: nome,
        description: texto,
        status: "pendente",
        origem: "hospede"
      };
      var res = await sb.from("manutencoes").insert(payload);
      if(res.error) throw res.error;
      salvarPedidoLocal(id, "manutencoes", "tipoReparo");
      renderAcompanhamento();
    }catch(err){
      console.error(err);
      content.innerHTML = '<div class="card error-box">'+t("erroEnviar")+'</div>' +
        '<button class="btn-ghost" id="tentarDeNovo">'+t("voltar")+'</button>';
      document.getElementById("tentarDeNovo").onclick = renderMenu;
    }
  }

  var TIPO_LABEL_KEY = {
    limpeza: "tipoLimpeza", reparo: "tipoReparo",
    sauna: "ligarSauna", lenha: "reposicaoLenha", frigobar: "tipoFrigobar"
  };

  var canaisAbertos = [];
  function pararAcompanhamentoRealtime(){
    canaisAbertos.forEach(function(ch){ sb.removeChannel(ch); });
    canaisAbertos = [];
  }

  async function renderAcompanhamento(){
    pararAcompanhamentoRealtime();
    var pedidos = carregarPedidosLocaisBrutos();
    if(pedidos.length === 0){ renderMenu(); return; }

    content.innerHTML =
      '<div class="card">' +
        '<p style="margin:0 0 12px;font-size:15px;font-weight:700;">'+t("seusPedidos")+'</p>' +
        '<div id="listaPedidos"></div>' +
        '<button class="btn-primary" id="novoPedido" style="margin-top:6px;">'+t("fazerOutroPedido")+'</button>' +
      '</div>';
    document.getElementById("novoPedido").onclick = function(){ pararAcompanhamentoRealtime(); renderMenu(); };

    var lista = document.getElementById("listaPedidos");

    function pintarLinha(p, status){
      var info = statusInfo(p.tabela, status);
      var concluido = (p.tabela === "manutencoes") ? "concluida" : "concluido";
      if(status === concluido) marcarConcluidoLocal(p.id);
      var el = document.getElementById("pedido_" + p.id);
      if(!el) return;
      el.innerHTML =
        '<span style="font-size:20px;">'+info.icone+'</span>' +
        '<span style="flex:1;"><span style="display:block;font-weight:600;font-size:14.5px;">'+escapeHtml(t(p.labelKey))+'</span>' +
        '<span style="font-size:12.5px;color:'+info.cor+';font-weight:600;">'+info.texto+'</span></span>';
    }

    pedidos.forEach(function(p){
      var linha = document.createElement("div");
      linha.id = "pedido_" + p.id;
      linha.style.cssText = "display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);";
      lista.appendChild(linha);
      pintarLinha(p, "pendente"); // estado inicial otimista, corrigido abaixo assim que a busca real chega
    });
    var ultimoDaLista = lista.lastElementChild;
    if(ultimoDaLista) ultimoDaLista.style.borderBottom = "none";

    // busca o status atual de cada um e liga o tempo real pra acompanhar mudanças
    for(var i=0;i<pedidos.length;i++){
      (function(p){
        sb.from(p.tabela).select("status").eq("id", p.id).single().then(function(res){
          if(res.data) pintarLinha(p, res.data.status);
        });
        var ch = sb.channel("acompanha-"+p.id)
          .on("postgres_changes", {event:"UPDATE", schema:"public", table:p.tabela, filter:"id=eq."+p.id}, function(payload){
            pintarLinha(p, payload.new.status);
          })
          .subscribe();
        canaisAbertos.push(ch);
      })(pedidos[i]);
    }
  }

  if(carregarPedidosLocaisBrutos().length > 0) renderAcompanhamento(); else renderMenu();
})();
</script>
</body>
</html>
